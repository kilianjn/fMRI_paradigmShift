[package]
name = "paradigmshift"
version = "0.6.7"
edition = "2021"
rust-version = "1.95"
description = "Timeline editor and presenter for fMRI paradigms (NNL SyncBox & ResponseGrips)"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
serialport = { version = "4.10", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
open = "5"
# sound: output devices + playback (decoding is done with symphonia, see media.rs)
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "aac", "isomp4"] }
# video: MP4/MOV demuxer + H.264 decoder (OpenH264, compiled into the executable)
mp4 = "0.14"
openh264 = "0.9"
# the same winit as eframe uses (monitor names for the screen menus)
winit = { version = "0.30.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# monitor names as shown in the Windows display settings
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Devices_Display", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# decoding video / sound in debug builds would be very slow otherwise
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package."symphonia-codec-aac"]
opt-level = 3
[profile.dev.package."symphonia-bundle-mp3"]
opt-level = 3
